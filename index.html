<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arianna Riva AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="home" class="home">
      <div class="photo-card">
        <img src="arianna.png" alt="Arianna Riva">
      </div>
      <div class="intro-card">
        <span class="badge">AI EXPERIENCE</span>
        <h1>Arianna Riva</h1>
        <p>La tua nuova esperienza con un'intelligenza artificiale interattiva.</p>
        <button id="startBtn">Inizia</button>
      </div>
    </section>

    <section id="chat" class="chat hidden">
      <header class="chat-header">
        <img src="arianna.png" alt="Arianna Riva">
        <div>
          <h2>Arianna Riva</h2>
          <span class="online"><i></i> Online</span>
        </div>
        <button id="backBtn" class="back">← Indietro</button>
      </header>

      <div id="messages" class="messages">
        <div class="message arianna">
          Ciao ❤️ Sono Arianna. Mi fa piacere conoscerti. Come ti chiami?
        </div>
      </div>

      <form id="chatForm" class="composer">
        <input id="messageInput" type="text" placeholder="Scrivi un messaggio…" autocomplete="off">
        <button type="submit">Invia</button>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
